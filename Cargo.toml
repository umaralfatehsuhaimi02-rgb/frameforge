[package]
name = "frameforge"
version = "0.2.0"
edition = "2021"
description = "Free, open-source real-time upscaler and frame generator for Windows"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Media",
  "Win32_Security",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

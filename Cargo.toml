[package]
name = "frameforge"
version = "0.1.0"
edition = "2021"
description = "Low-latency frame pacing and scaling toolkit"
license = "MIT"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
